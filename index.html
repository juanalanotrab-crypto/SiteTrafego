<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Academia: força, foco e resultado.">
  <title>Academia | Bem-vindo</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="hero" id="hero">
    <div class="imagem-fundo" aria-hidden="true"></div>
    <div class="filtro-preto" aria-hidden="true"></div>
    <div class="vinheta" aria-hidden="true"></div>

    <section class="mensagem" aria-labelledby="titulo-principal">
      <h1 id="titulo-principal">
        <span class="linha">BEM</span>
        <span class="linha">VINDO</span>
      </h1>

      <form class="form-login" action="./comece-agora.html" method="get">
        <div class="campo-login">
          <label for="usuario">USUÁRIO</label>
          <input
            id="usuario"
            name="usuario"
            type="text"
            placeholder="Digite seu usuário"
            autocomplete="username"
            required
          >
        </div>

        <div class="campo-login">
          <label for="senha">SENHA</label>
          <input
            id="senha"
            name="senha"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="botao-login" type="submit">
          ENTRAR
        </button>
      </form>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
